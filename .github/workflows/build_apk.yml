name: Build & Release APK

on:
  push:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mbongo-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Mbongo APK - Build ${{ github.run_number }}"
          body: |
            ## Mbongo Android APK

            **Comment installer sur ton téléphone Android :**
            1. Télécharge `app-debug.apk` ci-dessous
            2. Sur ton téléphone : Paramètres → Sécurité → Activer "Sources inconnues"
            3. Ouvre le fichier APK téléchargé et installe
            4. Lance l'app Mbongo

            Build automatique depuis le commit `${{ github.sha }}`
          files: build/app/outputs/flutter-apk/app-debug.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
